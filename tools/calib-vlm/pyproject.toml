[project]
name = "splitflap-calib-vlm"
version = "0.1.0"
description = "VLM-reader auto-calibration web app for the modular split-flap display"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.115",
    "uvicorn>=0.30",
    "requests>=2.31",
    "numpy>=1.26",
    "opencv-python-headless>=4.8",
    "splitflap-calib",
]

[project.scripts]
calib-vlm-server = "calib_vlm.server:main"

[dependency-groups]
dev = [
    "pytest>=8.0",
    "httpx>=0.27",
]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.uv.sources]
splitflap-calib = { path = "../calib", editable = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["calib_vlm"]
