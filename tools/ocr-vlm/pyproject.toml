[project]
name = "splitflap-ocr-vlm"
version = "0.1.0"
description = "VLM read benchmark: score model transcriptions of split-flap photos against a reads.jsonl dataset"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.115",
    "uvicorn>=0.30",
    "opencv-python-headless>=4.8",
    "splitflap-calib-vlm",
]

[project.scripts]
ocr-vlm-server = "ocr_vlm.server:main"

[dependency-groups]
dev = [
    "pytest>=8.0",
    "httpx>=0.27",
]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.uv.sources]
splitflap-calib-vlm = { path = "../calib-vlm", editable = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["ocr_vlm"]
