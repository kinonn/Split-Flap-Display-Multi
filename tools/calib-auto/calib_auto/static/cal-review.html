<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Calib Auto — Review calibration run</title>
<style>
  :root { --bg:#14161a; --card:#1d2026; --card2:#23272e; --line:#2e333b;
          --fg:#d8dce2; --dim:#8a919c; --accent:#4ea1ff; --good:#4ec98a;
          --warn:#e0b04c; --bad:#e06c6c; }
  * { box-sizing:border-box; }
  body { margin:0; background:var(--bg); color:var(--fg); font:14px/1.45 system-ui,Segoe UI,sans-serif; }
  .wrap { max-width:1280px; margin:0 auto; padding:20px 18px 60px; }
  h1 { font-size:19px; margin:0 0 2px; } h1 a { color:var(--dim); text-decoration:none; font-size:13px; }
  h2 { font-size:12px; text-transform:uppercase; letter-spacing:.08em; color:var(--dim); margin:16px 0 8px; }
  .cols { display:grid; grid-template-columns:1fr 380px; gap:16px; align-items:start; }
  .card { background:var(--card); border:1px solid var(--line); border-radius:10px; padding:14px; margin-bottom:14px; }
  input, select { width:100%; background:var(--card2); color:var(--fg); border:1px solid var(--line); border-radius:6px; padding:6px 8px; font:inherit; }
  button { background:var(--card2); color:var(--fg); border:1px solid var(--line); border-radius:6px; padding:7px 12px; font:inherit; cursor:pointer; }
  button:hover { border-color:var(--accent); } button:disabled { opacity:.4; cursor:default; }
  .btns { display:flex; gap:8px; margin-top:12px; flex-wrap:wrap; }
  .msg { color:var(--warn); margin-top:8px; min-height:18px; }
  .meta { color:var(--dim); font-size:12px; }
  #stage { width:100%; background:#000; border:1px solid var(--line); border-radius:8px; display:block; }
  .chips { display:flex; flex-wrap:wrap; gap:8px; justify-content:center; width:90%; margin:10px auto 0; }
      .chip { width:50px; height:84px; display:flex; flex-direction:column; align-items:center; justify-content:center;
        background:var(--card2); border:1px solid var(--line); border-radius:6px; font:48px/1 ui-monospace,Consolas,monospace; }
  .chip.space { color:var(--dim); background:#191c21; }
  .chip.bad { border-color:var(--bad); }
  .chip .detail { font:10px/1.2 system-ui,Segoe UI,sans-serif; color:var(--dim); margin-top:7px; white-space:nowrap; }
  .chip .source-model { color:var(--accent); } .chip .source-cv { color:var(--good); }
  .list { max-height:460px; overflow:auto; }
  .entry { display:flex; justify-content:space-between; gap:8px; padding:5px 6px; border-radius:4px; cursor:pointer; font:12px ui-monospace,Consolas,monospace; }
  .entry:hover { background:var(--card2); } .entry.sel { background:#1f2a36; }
  .result { color:var(--warn); } .result.done { color:var(--good); }
  @media (max-width:800px) { .cols { grid-template-columns:1fr; } .chip { width:42px; height:72px; font-size:40px; } }
</style>
</head>
<body>
<div class="wrap">
  <h1>Review calibration run <a href="/">← back</a></h1>
  <div class="meta">Inspect each captured frame after calibration. CNN runs include the detected display and module boxes; character cards show the reader output, confidence and source.</div>
  <div class="cols">
    <div>
      <div class="card">
        <h2 style="margin-top:0">Frame <span class="meta" id="framecount"></span></h2>
        <canvas id="stage"></canvas>
        <div class="meta" id="frameinfo" style="margin-top:8px"></div>
        <div class="chips" id="chips"></div>
        <div class="btns">
          <button id="prev" onclick="nav(-1)">← Prev</button>
          <button id="next" onclick="nav(1)">Next →</button>
        </div>
        <div class="msg" id="msg"></div>
      </div>
    </div>
    <div>
      <div class="card">
        <h2 style="margin-top:0">Runs</h2>
        <select id="run" onchange="openRun(this.value)"></select>
        <div class="meta" id="runinfo" style="margin-top:8px"></div>
        <div class="msg" id="runsmsg"></div>
      </div>
      <div class="card">
        <h2 style="margin-top:0">Captured frames <span class="meta" id="listcount"></span></h2>
        <div class="list" id="list"></div>
      </div>
    </div>
  </div>
</div>
<script>
const $ = id => document.getElementById(id);
async function api(path) {
  const r = await fetch(path);
  if (!r.ok) throw new Error((await r.json().catch(() => ({}))).detail || r.statusText);
  return r.json();
}
function esc(s) { return String(s == null ? "" : s).replace(/[&<>\"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;"}[c])); }
let runName = "", frames = [], index = -1, image = null;

async function loadRuns() {
  try {
    const d = await api("/api/cal/runs");
    const runs = d.runs || [];
    $("run").innerHTML = runs.map(r =>
      `<option value="${esc(r.run)}">${esc(r.run)} — ${esc(r.approach || "?")} · ${r.frames} frame(s)</option>`).join("")
      || `<option value="">no completed runs yet</option>`;
    if (runs.length) await openRun(runs[0].run);
  } catch (e) { $("runsmsg").textContent = "load failed: " + e.message; }
}
async function openRun(name) {
  if (!name) return;
  try {
    const d = await api(`/api/cal/run/${encodeURIComponent(name)}/frames`);
    runName = name; frames = d.frames || []; index = frames.length ? 0 : -1;
    $("runinfo").innerHTML = `<b>${esc(name)}</b> · ${esc(d.approach || "?")} · ` +
      `<span class="result ${d.result === "converged" ? "done" : ""}">${esc(d.result || "unknown")}</span>` +
      (d.reason ? ` · ${esc(d.reason)}` : "");
    renderList(); renderFrame();
  } catch (e) { $("runsmsg").textContent = "open failed: " + e.message; }
}
function renderList() {
  $("listcount").textContent = `(${frames.length})`;
  $("list").innerHTML = frames.map((f, i) =>
    `<div class="entry ${i === index ? "sel" : ""}" onclick="jump(${i})"><span>${i + 1}. ${esc(f.photo || "")}</span><span>${esc(f.read || "")}</span></div>`).join("")
    || `<div class="meta">no captured frames</div>`;
}
function jump(i) { if (i < 0 || i >= frames.length) return; index = i; renderList(); renderFrame(); }
function nav(delta) { jump(index + delta); }
function sourceLabel(source) {
  if (source === "classifier") return ["M", "source-model"];
  if (source === "cv") return ["CV", "source-cv"];
  if (source === "vlm") return ["VLM", "source-model"];
  return [source || "?", ""];
}
function renderChips(frame) {
  const modules = frame.modules || [];
  $("chips").innerHTML = modules.map((m, i) => {
    const [label, cls] = sourceLabel(m.source);
    const ch = m.char === " " ? "␣" : (m.char || "?");
    return `<div class="chip ${m.condition === "unreadable" ? "bad" : ""} ${m.char === " " ? "space" : ""}">` +
      `${esc(ch)}<span class="detail ${cls}">${esc(label)} · ${Number(m.confidence || 0).toFixed(2)}</span></div>`;
  }).join("");
}
function renderFrame() {
  const frame = frames[index];
  const has = !!frame;
  $("prev").disabled = !has || index <= 0; $("next").disabled = !has || index >= frames.length - 1;
  $("framecount").textContent = has ? `${index + 1}/${frames.length}` : "";
  if (!has) { $("frameinfo").textContent = ""; $("chips").innerHTML = ""; return; }
  $("frameinfo").innerHTML = `<b>${esc(frame.photo)}</b> · commanded ${esc(frame.frame || "")} · read ${esc(frame.read || "")}` +
    (frame.boxes ? ` · ${frame.boxes.length} module boxes` : " · no persisted boxes for this frame");
  renderChips(frame);
  image = new Image();
  image.onload = draw;
  image.onerror = () => { $("msg").textContent = "image could not be loaded"; };
  image.src = `/api/cal/run/${encodeURIComponent(runName)}/photo/${encodeURIComponent(frame.photo)}?t=${Date.now()}`;
  $("msg").textContent = "";
}
function draw() {
  const canvas = $("stage"), maxWidth = canvas.parentElement.clientWidth || 900;
  const scale = Math.min(1, maxWidth / image.naturalWidth);
  canvas.width = Math.round(image.naturalWidth * scale); canvas.height = Math.round(image.naturalHeight * scale);
  const ctx = canvas.getContext("2d"); ctx.drawImage(image, 0, 0, canvas.width, canvas.height);
  const boxes = frames[index].boxes || [];
  const geometrySize = frames[index].geometry_image_size || [image.naturalWidth, image.naturalHeight];
  const geometryScaleX = image.naturalWidth / geometrySize[0];
  const geometryScaleY = image.naturalHeight / geometrySize[1];
  boxes.forEach((b, i) => {
    const x = b[0] * geometryScaleX * scale, y = b[1] * geometryScaleY * scale;
    const w = (b[2] - b[0]) * geometryScaleX * scale;
    const h = (b[3] - b[1]) * geometryScaleY * scale;
    ctx.strokeStyle = "#4ea1ff"; ctx.lineWidth = Math.max(1, 2 * scale); ctx.strokeRect(x, y, w, h);
    ctx.fillStyle = "#4ea1ff"; ctx.font = `${Math.max(10, 14 * scale)}px system-ui`; ctx.fillText(String(i + 1), x + 3, y + 15 * scale);
  });
}
window.addEventListener("resize", () => { if (image && image.complete) draw(); });
loadRuns();
</script>
</body>
</html>
