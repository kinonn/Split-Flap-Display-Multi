[project]
name = "splitflap-calib"
version = "0.1.0"
description = "Vision-guided auto-calibration runner for the modular split-flap display (USB camera + LAN HTTP, master host only)"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "requests>=2.31",
    "opencv-python>=4.8",
    "numpy>=1.26",
]

[project.scripts]
splitflap-calib = "calib.cli:main"

[dependency-groups]
dev = [
    "pytest>=8.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["calib"]
